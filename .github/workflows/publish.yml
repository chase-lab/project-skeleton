# Builds the Quarto website and publishes it to the gh-pages branch, on every
# push to main and on demand (Actions tab > Quarto Publish > Run workflow).
# One-time setup: see "Project website" in PROJECT_STRUCTURE.md.
name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the workflow push to the gh-pages branch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Quarto needs R to process R chunks, even when they are not evaluated.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # Only runs once you have created renv.lock with renv::init() and
      # renv::snapshot(). Without renv.lock this step is skipped.
      - name: Restore packages with renv
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
